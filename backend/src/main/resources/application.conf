ktor {
    deployment {
        port = 8080
        port = ${?KTOR_PORT}
    }
    application {
        modules = [ com.example.cleancity.ApplicationKt.module ]
    }
}

# Все чувствительные значения читаются из переменных окружения (см. .env.example).
# Дефолты для локальной разработки — НЕ для production. На prod все ENV должны быть
# установлены, иначе DatabaseConfig упадёт fail-fast (см. DatabaseConfig.kt).
database {
    url = "jdbc:postgresql://localhost:5433/cleancity"
    url = ${?DB_URL}
    user = "cleancity"
    user = ${?DB_USER}
    password = ""
    password = ${?DB_PASSWORD}
}

storage {
    path = "./uploads"
    path = ${?STORAGE_PATH}
    s3 {
        bucket = ""
        bucket = ${?STORAGE_S3_BUCKET}
        access_key = ""
        access_key = ${?STORAGE_S3_ACCESS_KEY}
        secret_key = ""
        secret_key = ${?STORAGE_S3_SECRET_KEY}
        region = "ru-central1"
        region = ${?STORAGE_S3_REGION}
        endpoint = "https://storage.yandexcloud.net"
        endpoint = ${?STORAGE_S3_ENDPOINT}
        public_url_base = ""
        public_url_base = ${?STORAGE_S3_PUBLIC_URL_BASE}
    }
}

jwt {
    secret = ""
    secret = ${?JWT_SECRET}
    issuer = "cleancity"
    issuer = ${?JWT_ISSUER}
    audience = "cleancity-api"
    audience = ${?JWT_AUDIENCE}
}

app {
    stage = "DEV"
    stage = ${?APP_STAGE}
    base_url = "http://localhost:8080"
    base_url = ${?APP_BASE_URL}
    # Версия документов «Политика ПДн / Условия использования», которые
    # фиксируются в users.accepted_terms_version при регистрации (152-ФЗ).
    # При изменении текстов в docs/legal/ — поднимаем версию, мобильное
    # приложение запросит повторное согласие.
    terms_version = "v1"
    terms_version = ${?APP_TERMS_VERSION}
    initial_admin {
        email = ${?INITIAL_ADMIN_EMAIL}
        password = ${?INITIAL_ADMIN_PASSWORD}
    }
}

email {
    from = "noreply@cleancity.local"
    from = ${?EMAIL_FROM}
    smtp_host = ""
    smtp_host = ${?SMTP_HOST}
    smtp_port = "465"
    smtp_port = ${?SMTP_PORT}
    smtp_user = ""
    smtp_user = ${?SMTP_USER}
    smtp_password = ""
    smtp_password = ${?SMTP_PASSWORD}
}
