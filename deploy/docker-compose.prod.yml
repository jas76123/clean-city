# deploy/docker-compose.prod.yml
# Прод-стек CleanCity. Запуск из /opt/cleancity/repo/deploy на боевой VM:
#   docker compose --env-file /opt/cleancity/.env.prod -f docker-compose.prod.yml up -d
# Секреты подтягиваются из /opt/cleancity/.env.prod (НЕ в git, mode 0600).

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Прокинут только на 127.0.0.1, чтобы /opt/cleancity/backup.sh
      # с хоста мог делать pg_dump через PGHOST=localhost.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Только на 127.0.0.1: даёт /opt/cleancity/healthcheck.sh достучаться
      # до /health на хосте (наружу backend проксирует Caddy через api.*).
      - "127.0.0.1:8080:8080"
    environment:
      APP_STAGE: PROD
      APP_BASE_URL: https://api.clean--city.ru
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY}
      STORAGE_S3_PUBLIC_URL_BASE: ${STORAGE_S3_PUBLIC_URL_BASE}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}

  web-admin:
    build:
      context: ..
      dockerfile: deploy/web-admin.Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/cleancity/landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web-admin

volumes:
  pgdata:
  caddy_data:
  caddy_config:
